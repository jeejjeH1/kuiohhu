<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>کتابخانه — X Auto Liker</title>
  <link rel="stylesheet" href="../fonts/fonts.css">
  <link rel="stylesheet" href="page.css">
  <style>
    .tabs { display: inline-flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--card); border: 1px solid var(--card-b); margin-inline-start: auto; }
    .tabs button { border: 0; background: none; padding: 7px 16px; border-radius: 10px; cursor: pointer; color: var(--muted); font-weight: 700; transition: .3s; }
    .tabs button.on { background: var(--grad); color: #fff; box-shadow: 0 6px 16px rgba(255, 46, 126, .3); }
    .layout { display: grid; grid-template-columns: 240px 1fr; gap: 18px; align-items: start; }
    @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }
    .folders { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 20px; }
    .folder { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 12px; cursor: pointer; border: 1px solid transparent; transition: .25s; }
    .folder:hover { background: rgba(255, 255, 255, .05); }
    .folder.on { background: rgba(255, 46, 126, .12); border-color: rgba(255, 46, 126, .4); }
    .folder .n { margin-inline-start: auto; font-size: 12px; color: var(--muted); background: rgba(255, 255, 255, .06); padding: 0 8px; border-radius: 99px; }
    .folder .tools { display: none; gap: 2px; }
    .folder:hover .tools { display: flex; }
    .folder .tools button { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 3px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .tw { display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 20px; background: var(--card); border: 1px solid var(--card-b);
      transition: transform .35s var(--spring), border-color .3s; animation: rise .5s var(--ease) both; }
    .tw:hover { transform: translateY(-3px); border-color: rgba(255, 46, 126, .4); }
    .tw .au { display: flex; align-items: center; gap: 10px; }
    .tw .au img { width: 38px; height: 38px; border-radius: 50%; background: #222; }
    .tw .au b { display: block; line-height: 1.3; }
    .tw .au span { font-size: 12px; color: var(--muted); direction: ltr; unicode-bidi: isolate; }
    .tw .tx { white-space: pre-wrap; unicode-bidi: plaintext; text-align: start; display: -webkit-box; -webkit-line-clamp: 7; -webkit-box-orient: vertical; overflow: hidden; }
    .tw .ph { width: 100%; max-height: 180px; object-fit: cover; border-radius: 14px; }
    .tw .note { font-size: 12.5px; color: #ffd1e3; background: rgba(255, 46, 126, .08); padding: 6px 10px; border-radius: 10px; }
    .tw .ft { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: auto; }
    .tag { font-size: 11.5px; padding: 1px 9px; border-radius: 99px; background: rgba(42, 212, 255, .12); color: #9fe9ff; cursor: pointer; }
    .tw .ft .act { margin-inline-start: auto; display: flex; gap: 4px; }
    .ib { width: 30px; height: 30px; border-radius: 9px; border: 0; background: rgba(255, 255, 255, .06); cursor: pointer; display: grid; place-items: center; text-decoration: none; color: inherit; }
    .ib:hover { background: rgba(255, 255, 255, .14); }
    .tlist { display: flex; flex-direction: column; gap: 10px; max-width: 760px; }
    .titem { display: flex; gap: 10px; align-items: flex-start; padding: 14px; border-radius: 16px; background: var(--card); border: 1px solid var(--card-b); }
    .titem textarea { flex: 1; min-height: 64px; resize: vertical; unicode-bidi: plaintext; }
  </style>
</head>
<body>
  <div class="aurora"><i></i><i></i></div>
  <div class="wrap">
    <header class="top">
      <div class="logo">📚</div>
      <div><h1>کتابخانه</h1><p>توییت‌های ذخیره‌شده، قالب‌ها و پیش‌نویس‌ها — همه فقط روی همین مرورگر</p></div>
      <nav class="tabs" id="tabs"><button data-tab="saved" class="on">پوشه‌ها</button><button data-tab="templates">قالب‌ها</button><button data-tab="drafts">پیش‌نویس‌ها</button></nav>
    </header>
    <main id="main"></main>
  </div>
  <script src="../i18n-dict.js"></script>
  <script src="../i18n.js"></script>
  <script src="library.js"></script>
</body>
</html>
