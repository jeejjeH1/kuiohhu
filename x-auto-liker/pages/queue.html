<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>صف انتشار — X Auto Liker</title>
  <link rel="stylesheet" href="../fonts/fonts.css">
  <link rel="stylesheet" href="page.css">
  <link rel="stylesheet" href="dark.css">
  <style>
    .wrap { max-width: 760px; }
    .inp, .ta { width: 100%; background: rgba(0,0,0,.35); border: 1px solid var(--card-b); border-radius: 12px; padding: 10px 12px; color: var(--text); font: inherit; outline: none; }
    .ta { min-height: 110px; resize: vertical; }
    .when { direction: ltr; }
    .cnt { font-size: 12px; color: var(--muted); direction: ltr; }
    .cnt.over { color: var(--red); }
    .item { display: grid; gap: 8px; padding: 12px; border: 1px solid var(--card-b); border-radius: 14px; background: rgba(255,255,255,.03); margin-top: 10px; }
    .item .txt { white-space: pre-wrap; word-break: break-word; }
    .item .meta { font-size: 12px; color: var(--muted); direction: ltr; text-align: left; }
    .item .acts { display: flex; flex-wrap: wrap; gap: 6px; }
    .badge { display: inline-block; font-size: 11.5px; padding: 1px 9px; border-radius: 99px; background: rgba(162,75,255,.16); border: 1px solid rgba(162,75,255,.45); color: #d6b8ff; }
    .badge.due { background: rgba(255,173,31,.14); border-color: rgba(255,173,31,.5); color: #ffd28a; }
    .empty { color: var(--muted); padding: 14px 0; }
    .tip { font-size: 12.5px; color: var(--muted); margin-top: 10px; }
    body.embed header.top .logo, body.embed header.top p { display: none; }
  </style>
</head>
<body>
  <div class="aurora"><i></i><i></i></div>
  <div class="wrap">
    <header class="top"><div class="logo">🗓</div><div><h1>صف انتشار</h1><p>پیش‌نویس و زمان‌بندی؛ انتشار را خودتان در X می‌زنید</p></div></header>

    <section class="card">
      <h2>توییت جدید</h2>
      <textarea id="text" class="ta" placeholder="متن توییت…" maxlength="5000"></textarea>
      <div class="row2" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px">
        <span id="cnt" class="cnt">0 / 280</span>
        <span style="flex:1"></span>
        <input id="when" class="inp when" type="datetime-local" style="width:auto">
      </div>
      <div class="row2" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
        <button class="btn" id="add">ذخیره در صف</button>
        <button class="btn ghost" id="addNow">فقط پیش‌نویس (بدون زمان)</button>
      </div>
      <div class="tip">زمان را خالی بگذارید اگر فقط پیش‌نویس می‌خواهید. وقتی زمانش برسد، یادآوری نشان داده می‌شود و با «باز کردن در X» کادر نوشتن X با همان متن باز می‌شود؛ دکمه‌ی ارسال را خودتان می‌زنید.</div>
    </section>

    <section class="card" style="margin-top:14px">
      <h2>زمان‌بندی‌شده</h2>
      <div id="sched"></div>
    </section>
    <section class="card" style="margin-top:14px">
      <h2>پیش‌نویس‌ها</h2>
      <div id="drafts"></div>
    </section>
  </div>
  <script src="../queue-core.js"></script>
  <script src="queue.js"></script>
</body>
</html>
