<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>رشته‌توییت — X Auto Liker</title>
  <link rel="stylesheet" href="../fonts/fonts.css">
  <link rel="stylesheet" href="page.css">
  <style>
    .wrap { max-width: 760px; }
    .bar { position: sticky; top: 12px; z-index: 2; display: flex; gap: 8px; justify-content: center; margin-bottom: 24px; }
    .paper { background: #fff; color: #0f1419; border-radius: 26px; padding: 44px 48px; box-shadow: 0 30px 80px rgba(0, 0, 0, .5); animation: rise .7s var(--ease) both; }
    .au { display: flex; align-items: center; gap: 14px; padding-bottom: 22px; margin-bottom: 26px; border-bottom: 1px solid #eff3f4; }
    .au img { width: 64px; height: 64px; border-radius: 50%; background: #eee; }
    .au b { font-size: 20px; display: block; line-height: 1.3; }
    .au span { color: #536471; direction: ltr; unicode-bidi: isolate; }
    .au small { margin-inline-start: auto; color: #536471; font-size: 12px; text-align: left; }
    .t { position: relative; padding: 0 0 22px 0; margin-bottom: 22px; border-bottom: 1px dashed #e6ecf0; font-size: 17px; line-height: 2; }
    .t:last-of-type { border-bottom: 0; }
    .t .n { position: absolute; inset-inline-start: -34px; top: 4px; width: 24px; height: 24px; border-radius: 50%; background: #f7f9f9; color: #536471; font-size: 11px; display: grid; place-items: center; }
    .t p { white-space: pre-wrap; unicode-bidi: plaintext; text-align: start; }
    .t img { display: block; max-width: 100%; border-radius: 16px; margin-top: 12px; }
    .src { margin-top: 10px; font-size: 12px; color: #536471; direction: ltr; text-align: left; word-break: break-all; }
    @media print {
      @page { margin: 18mm; }
      html, body { background: #fff !important; }
      .aurora, .bar { display: none !important; }
      .wrap { padding: 0; max-width: none; }
      .paper { box-shadow: none; padding: 0; border-radius: 0; }
      .t { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div class="aurora"><i></i><i></i></div>
  <div class="wrap">
    <div class="bar"><button class="btn" id="pdf">📄 ذخیره PDF / چاپ</button><button class="btn ghost" id="cp">کپی متن</button></div>
    <article class="paper" id="paper"></article>
  </div>
  <script src="../i18n-dict.js"></script>
  <script src="../i18n.js"></script>
  <script src="thread.js"></script>
</body>
</html>
